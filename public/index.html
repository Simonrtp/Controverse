<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geg Dossier</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        color: #1a1a1a;
        background: linear-gradient(160deg, #f0f4ff 0%, #fafafa 50%, #f5f0ff 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      main {
        max-width: 32rem;
        background: #fff;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
      }

      p {
        color: #555;
        margin-bottom: 1.5rem;
      }

      a {
        display: inline-block;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        padding: 0.6rem 1.25rem;
        border-radius: 8px;
        font-weight: 500;
        transition: background 0.2s;
      }

      a:hover {
        background: #1d4ed8;
      }

      footer {
        margin-top: 2rem;
        font-size: 0.875rem;
        color: #888;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bienvenue</h1>
      <p>
        Page HTML simple. Ouvrez ce fichier dans votre navigateur ou servez le
        dossier <code>public</code> avec un serveur local.
      </p>
      <a href="#">Commencer</a>
      <footer>&copy; 2026 Geg Dossier</footer>
    </main>
  </body>
</html>
